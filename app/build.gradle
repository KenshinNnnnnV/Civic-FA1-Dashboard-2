plugins {
    id 'com.android.application'
}

android {
    namespace 'com.civicfa1.dashboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.civicfa1.dashboard"
        minSdk 23
        targetSdk 34
        versionCode 6
        versionName "0.2.4"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
